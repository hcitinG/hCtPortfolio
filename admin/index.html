<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>登入作品集後台 — hCt</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="login.css"><script type="module" src="login.js"></script></head><body>
<header class="login-header"><a class="login-brand" href="../index.html" aria-label="返回作品集">hCt<span>•</span></a><a class="return-site" href="../index.html">返回作品集</a></header>
<main class="login-main"><section class="login-panel" aria-labelledby="login-title"><p class="eyebrow">PORTFOLIO ADMIN</p><h1 id="login-title">作品集管理<span>.</span></h1><p class="intro">僅限指定的管理員帳號。</p>
<button id="google-login" class="google-login" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3c1.9-1.8 2.9-4.3 2.9-7.5Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.6c-.9.6-2.1 1-3.4 1-2.6 0-4.8-1.8-5.6-4.2H3v2.7A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.8a6 6 0 0 1 0-3.6V7.5H3a10 10 0 0 0 0 9l3.4-2.7Z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.9 1.5l2.9-2.9A9.6 9.6 0 0 0 12 2a10 10 0 0 0-9 5.5l3.4 2.7C7.2 7.8 9.4 6 12 6Z"/></svg><span>使用 Google 帳號登入</span></button><p class="login-divider">或使用 Email 登入</p>
<form id="login-form"><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="username" required spellcheck="false"><label for="password">密碼</label><div class="password-field"><input id="password" type="password" name="password" autocomplete="current-password" required><button id="show-password" type="button" aria-label="顯示密碼" aria-pressed="false">顯示</button></div><button class="login-submit" id="login-submit" type="submit">登入後台</button></form>
<button id="reset-password" class="reset-password" type="button">忘記密碼</button><p id="login-message" role="status" aria-live="polite"></p><p id="connection-note" class="connection-note" hidden>尚未連接 Firebase。完成專案設定後，就能使用你的管理員帳號登入。</p></section></main>
<footer class="login-footer"><span>hCt — Portfolio management</span></footer></body></html>
