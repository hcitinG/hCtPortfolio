<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="黃琪婷 Huang Ci Ting 設計作品集">
  <meta name="theme-color" content="#f3f1ee">
  <title>黃琪婷．作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"><span id="scroll-progress-bar"></span></div>

  <div id="page" class="site">
    <main id="main" class="site-main">
      <section class="portfolio-hero" aria-labelledby="portfolio-title">
        <div class="hero-topline reveal-on-load">
          <span>PORTFOLIO</span>
          <span>© 2026</span>
        </div>

        <h1 id="portfolio-title" class="portfolio-name" aria-label="作品展示">
          <span class="name-line name-line-a">作 品</span>
          <span class="name-line name-line-b">展 示</span>
        </h1>

        <div class="hero-bottom reveal-on-load">
          <p class="hero-kicker">HUANG CI TING · VISUAL DESIGN PORTFOLIO</p>
          <p class="hero-note">SELECTED WORKS · 2026</p>
        </div>

        <div class="hero-divider reveal-on-load" aria-hidden="true"><span></span></div>
      </section>

      <section class="portfolio-section" aria-label="作品展示">
        <div class="filter-shell" id="filter-shell">
          <div class="filter-inner">
            <div class="filter-label" aria-hidden="true">FILTER</div>
            <nav class="portfolio-filters" aria-label="作品分類">
              <div class="simplefilter_37" id="portfolio-filters">
                <button class="filter-button active" type="button" data-filter="all" aria-pressed="true"><span>All</span></button>
                <button class="filter-button" type="button" data-filter="1" aria-pressed="false"><span>活動BN</span></button>
                <button class="filter-button" type="button" data-filter="2" aria-pressed="false"><span>社群廣告</span></button>
                <button class="filter-button" type="button" data-filter="4" aria-pressed="false"><span>產品EDM</span></button>
                <button class="filter-button" type="button" data-filter="5" aria-pressed="false"><span>網站視覺</span></button>
                <button class="filter-button" type="button" data-filter="6" aria-pressed="false"><span>印刷品</span></button>
                <button class="filter-button" type="button" data-filter="7" aria-pressed="false"><span>遊戲類</span></button>
              </div>
            </nav>
          </div>
        </div>

        <div class="gallery-wrap">
          <div id="gallery" class="filter_gallery_37 filtr-container" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-rule"></div>
      <div class="footer-inner">
        <p>© Copyright 2026 · 黃琪婷．作品集</p>
        <button class="back-to-top" id="back-to-top" type="button" aria-label="回到頁面頂端">BACK TO TOP <span>↑</span></button>
      </div>
    </footer>
  </div>

  <script src="js/vendor/jquery.min.js"></script>
  <script src="js/vendor/lightbox.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
