<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="黃琪婷視覺設計作品集，收錄社群廣告、活動BN、產品EDM、網站視覺、印刷品與遊戲類作品。">
  <meta name="theme-color" content="#faf7f6">
  <title>黃琪婷｜視覺設計作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"><span id="scroll-progress-bar"></span></div>

  <div id="page" class="site">
    <main id="main" class="site-main">
      <section class="portfolio-hero" aria-labelledby="portfolio-title">
        <div class="hero-art" aria-hidden="true">
          <span class="deco deco-wave deco-wave-a" data-speed="0.16"></span>
          <span class="deco deco-wave deco-wave-b" data-speed="0.1"></span>
          <span class="deco deco-dot deco-dot-a" data-speed="0.22"></span>
          <span class="deco deco-dot deco-dot-b" data-speed="0.18"></span>
          <span class="deco deco-orb deco-orb-a" data-speed="0.07"></span>
          <span class="deco deco-orb deco-orb-b" data-speed="0.11"></span>
          <span class="deco deco-orb deco-orb-c" data-speed="0.14"></span>
          <span class="deco deco-ring" data-speed="0.09"></span>
          <span class="deco deco-point deco-point-a" data-speed="0.15"></span>
          <span class="deco deco-point deco-point-b" data-speed="0.19"></span>
        </div>

        <a class="site-mark reveal-on-load" href="#main" aria-label="回到首頁">hc</a>

        <div class="hero-copy">
          <h1 id="portfolio-title" class="portfolio-title">
            <span class="hero-title-line">作品展示</span>
          </h1>
          <p class="portfolio-subtitle reveal-on-load">HUANG&nbsp;CI&nbsp;TING｜視&nbsp;覺&nbsp;設&nbsp;計&nbsp;作&nbsp;品&nbsp;集</p>
        </div>
      </section>

      <section class="portfolio-section" aria-label="作品展示">
        <div class="filter-shell" id="filter-shell">
          <nav class="portfolio-filters" aria-label="作品分類">
            <div class="simplefilter_37" id="portfolio-filters">
              <button class="filter-button active" type="button" data-filter="all" aria-pressed="true"><span>全部</span></button>
              <button class="filter-button" type="button" data-filter="1" aria-pressed="false"><span>活動BN</span></button>
              <button class="filter-button" type="button" data-filter="2" aria-pressed="false"><span>社群廣告</span></button>
              <button class="filter-button" type="button" data-filter="4" aria-pressed="false"><span>產品EDM</span></button>
              <button class="filter-button" type="button" data-filter="5" aria-pressed="false"><span>網站視覺</span></button>
              <button class="filter-button" type="button" data-filter="6" aria-pressed="false"><span>印刷品</span></button>
              <button class="filter-button" type="button" data-filter="7" aria-pressed="false"><span>遊戲類</span></button>
            </div>
          </nav>
        </div>

        <div class="gallery-wrap">
          <div id="gallery" class="filter_gallery_37 filtr-container" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-message">用設計傳遞價值，讓視覺說好每個故事</p>
        <span class="footer-accent" aria-hidden="true"></span>
        <p class="footer-copy">© 2024 HUANG&nbsp;CI&nbsp;TING&nbsp;PORTFOLIO </p>
      </div>
    </footer>
  </div>

  <script src="js/vendor/jquery.min.js"></script>
  <script src="js/vendor/lightbox.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
